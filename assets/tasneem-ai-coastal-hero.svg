<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">ساحل يمني وطائرة تحلق فوق البحر</title>
<desc id="desc">مشهد ساحلي سينمائي مستوحى من سواحل اليمن، بحر أزرق وجبال بعيدة وقرية ساحلية وطائرة ركاب في السماء</desc>
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#123b4a"/><stop offset=".42" stop-color="#4c8790"/><stop offset=".72" stop-color="#e4ad78"/><stop offset="1" stop-color="#f6d6a3"/></linearGradient>
 <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#4d9294"/><stop offset=".4" stop-color="#1c6470"/><stop offset="1" stop-color="#092f3c"/></linearGradient>
 <linearGradient id="sunpath" x2="0" y2="1"><stop stop-color="#ffe7b3" stop-opacity=".7"/><stop offset="1" stop-color="#f2c27d" stop-opacity="0"/></linearGradient>
 <linearGradient id="cliff" x2=".8" y2="1"><stop stop-color="#c28b64"/><stop offset="1" stop-color="#344b4a"/></linearGradient>
 <linearGradient id="town" x2="0" y2="1"><stop stop-color="#f3dfbd"/><stop offset="1" stop-color="#b98d69"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="34"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
 <filter id="shadow"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
