<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">طائرة اليمنية</title><desc id="desc">رسم توضيحي لطائرة ركاب تحمل هوية الخطوط الجوية اليمنية</desc>
<defs>
 <linearGradient id="body" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".48" stop-color="#f8fbfc"/><stop offset=".78" stop-color="#d9e2e7"/><stop offset="1" stop-color="#aebdc7"/></linearGradient>
 <linearGradient id="wing" x2="0" y2="1"><stop stop-color="#f8fcff"/><stop offset="1" stop-color="#91a5b2"/></linearGradient>
 <linearGradient id="engine" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".65" stop-color="#c8d4db"/><stop offset="1" stop-color="#687e8b"/></linearGradient>
 <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feGaussianBlur stdDeviation="13"/></filter>
</defs>
<ellipse cx="610" cy="430" rx="470" ry="35" fill="#062b3b" opacity=".18" filter="url(#shadow)"/>
<!-- tail and far wing -->
<path d="M185 280 L95 70 Q91 52 112 54 L174 68 L315 275 Z" fill="#c8192e" stroke="#e8edf0" stroke-width="5"/>
