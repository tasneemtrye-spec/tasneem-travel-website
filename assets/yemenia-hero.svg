<path d="M70 323 Q122 286 245 280 L1002 277 Q1084 278 1148 315 Q1168 327 1148 344 Q1112 372 1020 382 L251 399 Q141 399 83 367 Q50 350 70 323Z" fill="url(#body)" stroke="#b7c5cc" stroke-width="4"/>
